name: tfsec

on:
  push:
   branches: [prod, dev, staging]
  pull_request:
   branches: [prod]
  schedule:
      - cron: '32 7 * * 1'

jobs:
  tfsec:
    name: Run tfsec sarif report
    runs-on: ubuntu-latest
    permissions:
         actions: read
         contents: read
         security-events: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Run tfsec
        run: tfsec/tfsec-sarif-action@9a83b5c3524f825c020e3563356855741fd02745f

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v1
        with: 
           sarif_file: tfsec.sarif
